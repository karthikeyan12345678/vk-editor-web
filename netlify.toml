# Netlify: connect the GitHub repository and these settings are picked up automatically.
[build]
  base = "frontend"
  command = "npm install && npm run build:web"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "22"

# Static files that are big and never change: let browsers keep them.
[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
